name: Release standalone apps

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_label: ubuntu-x86_64
            archive_name: lwrclpy-web-node-editor-ubuntu-x86_64.tar.gz
            archive_path: dist/lwrclpy-web-node-editor-ubuntu-x86_64.tar.gz
            package_arch: x86_64
          - os: ubuntu-22.04-arm
            artifact_label: ubuntu-arm64
            archive_name: lwrclpy-web-node-editor-ubuntu-arm64.tar.gz
            archive_path: dist/lwrclpy-web-node-editor-ubuntu-arm64.tar.gz
            package_arch: aarch64
          - os: windows-2022
            artifact_label: windows-x86_64
            archive_name: lwrclpy-web-node-editor-windows-x86_64.zip
            archive_path: dist/lwrclpy-web-node-editor-windows-x86_64.zip
          - os: windows-11-arm
            artifact_label: windows-arm64
            archive_name: lwrclpy-web-node-editor-windows-arm64.zip
            archive_path: dist/lwrclpy-web-node-editor-windows-arm64.zip
          - os: macos-14
            artifact_label: macos-arm64
            archive_name: lwrclpy-web-node-editor-macos-arm64.zip
            archive_path: dist/lwrclpy-web-node-editor-macos-arm64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Import macOS Developer ID certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12_BASE64" ]]; then
            echo "MACOS_CERTIFICATE_P12_BASE64 is not set; macOS app will be ad-hoc signed."
            exit 0
          fi
          if [[ -z "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            echo "MACOS_CERTIFICATE_PASSWORD is required when MACOS_CERTIFICATE_P12_BASE64 is set." >&2
            exit 1
          fi

          keychain_password="${MACOS_KEYCHAIN_PASSWORD:-$(openssl rand -hex 24)}"
          keychain_path="$RUNNER_TEMP/build-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"

          if ! printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path" 2>/dev/null; then
            printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          fi
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | sed 's/[" ]//g')
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"

          identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "Developer ID Application identity not found in imported certificate." >&2
            security find-identity -v -p codesigning "$keychain_path"
            exit 1
          fi
          echo "MAC_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Create Python virtual environment
        if: runner.os != 'Windows'
        run: |
          python -m venv .ci-venv
          echo "PYTHON_BIN=$PWD/.ci-venv/bin/python" >> "$GITHUB_ENV"
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"

      - name: Create Python virtual environment
        if: runner.os == 'Windows'
        run: |
          python -m venv .ci-venv
          "PYTHON_BIN=$env:GITHUB_WORKSPACE\.ci-venv\Scripts\python.exe" >> $env:GITHUB_ENV
          "$env:GITHUB_WORKSPACE\.ci-venv\Scripts" >> $env:GITHUB_PATH

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            file \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcb-xfixes0 \
            libxcb1 \
            patchelf

      - name: Install lwrclpy
        if: runner.os != 'Windows'
        run: |
          "$PYTHON_BIN" scripts/install_lwrclpy.py

      - name: Install lwrclpy
        if: runner.os == 'Windows'
        run: |
          & $env:PYTHON_BIN scripts\install_lwrclpy.py

      - name: Build Linux standalone app
        if: runner.os == 'Linux'
        run: scripts/build_linux_standalone.sh

      - name: Build macOS standalone app
        if: runner.os == 'macOS'
        run: scripts/build_macos_standalone.sh

      - name: Notarize macOS app
        if: runner.os == 'macOS'
        env:
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          if [[ -z "${MAC_CODESIGN_IDENTITY:-}" || "$MAC_CODESIGN_IDENTITY" == "-" ]]; then
            echo "Skipping notarization because the app is not Developer ID signed."
            exit 0
          fi
          if [[ -z "$MACOS_NOTARY_KEY_ID" || -z "$MACOS_NOTARY_ISSUER_ID" || -z "$MACOS_NOTARY_KEY" ]]; then
            echo "Skipping notarization because notary secrets are not fully configured."
            exit 0
          fi

          notary_key_path="$RUNNER_TEMP/AuthKey_${MACOS_NOTARY_KEY_ID}.p8"
          notary_zip_path="$RUNNER_TEMP/lwrclpy-web-node-editor-notary.zip"
          printf '%s' "$MACOS_NOTARY_KEY" > "$notary_key_path"
          perl -0pi -e 's/\\n/\n/g' "$notary_key_path"
          xcrun notarytool store-credentials lwrclpy-web-node-editor-notary \
            --key "$notary_key_path" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID"
          ditto -c -k --keepParent dist/lwrclpy-web-node-editor.app "$notary_zip_path"
          xcrun notarytool submit "$notary_zip_path" \
            --keychain-profile lwrclpy-web-node-editor-notary \
            --wait
          xcrun stapler staple dist/lwrclpy-web-node-editor.app
          xcrun stapler validate dist/lwrclpy-web-node-editor.app

      - name: Build Windows standalone app
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts\build_windows_standalone.ps1

      - name: Smoke test Windows desktop imports
        if: runner.os == 'Windows'
        run: '& "dist\lwrclpy-web-node-editor\lwrclpy-web-node-editor.exe" --desktop-import-check'

      - name: Package Linux app
        if: runner.os == 'Linux'
        env:
          APP_ARCH: ${{ matrix.package_arch }}
        run: |
          app_arch="${APP_ARCH:-$(uname -m)}"
          assets=(
            lwrclpy-web-node-editor
            lwrclpy-web-node-editor.AppDir
            "lwrclpy-web-node-editor-${app_arch}.run"
          )
          for optional_asset in \
            "lwrclpy-web-node-editor-${app_arch}.AppImage" \
            "lwrclpy-web-node-editor-${app_arch}.AppImage.runtime"; do
            if [[ -e "dist/$optional_asset" ]]; then
              assets+=("$optional_asset")
            fi
          done
          tar -C dist -czf "${{ matrix.archive_path }}" "${assets[@]}"

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent dist/lwrclpy-web-node-editor.app "${{ matrix.archive_path }}"

      - name: Package Windows app
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\lwrclpy-web-node-editor -DestinationPath "${{ matrix.archive_path }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_label }}
          path: ${{ matrix.archive_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
